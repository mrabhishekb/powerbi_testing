checks:
  gold.sales_enriched:
    completeness:
      - missing_count(order_item_id) = 0:
          name: order_item_id_not_null
          attributes:
            description: "order_item_id must not be null"

      - missing_count(product_id) = 0:
          name: product_id_not_null
          attributes:
            description: "product_id must not be null"

      - row_count > 0:
          name: has_rows
          attributes:
            description: "Model should contain rows"

    validity:
      - failed rows:
          name: non_negative_revenue
          fail query: |
            SELECT order_item_id, order_item_total_amount
            FROM gold.sales_enriched
            WHERE order_item_total_amount < 0
          samples limit: 10
          attributes:
            description: "Revenue should be non-negative"
