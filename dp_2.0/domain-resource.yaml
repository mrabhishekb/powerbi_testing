version: v1alpha
type: vulcan
name: powerbi-testing-dp-mrab
tags:
  - sales_analytics
  - postgres
spec:
  runAsUser: "abhishekbharadwajtmdcio"
  compute: lenovo-2.0
  engine: postgres
  repo:
    url: https://github.com/mrabhishekb/powerbi_testing
    syncFlags:
      - "--ref=main"
      - "--submodules=off"
    baseDir: powerbi_testing/dp_2.0
    secretId: lenovo-sandbox:git-sync-mrab
  depots:
    - dataos://lenovopostgresdbconnection2?purpose=rw
  workflow:
    type: schedule
    schedule:
      crons:
        - "0 * * * *"
      endOn: "2027-01-01T00:00:00-00:00"
      timezone: "Asia/Kolkata"
      concurrencyPolicy: Forbid
    logLevel: INFO
    plan:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - plan
        - --auto-apply
    run:
      command:
        - vulcan
      arguments:
        - --log-to-stdout
        - run
  api:
    replicas: 1
    logLevel: INFO
