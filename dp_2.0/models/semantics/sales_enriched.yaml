kind: semantic
name: sales_enriched
depends_on: gold.sales_enriched
description: Semantic model for sales revenue analysis by category and shipment timeline.

dimensions:
  - name: order_item_id
    description: Unique row identifier for an order item.
    behavior:
      type: identifier
  - name: order_id
    description: Parent order identifier.
  - name: product_id
    description: Product identifier.
  - name: product_name
  - name: product_category
  - name: product_subcategory
  - name: product_brand
  - name: product_supplier_country
  - name: order_item_fulfillment_status
  - name: order_item_warehouse_region
  - name: order_item_shipped_date
  - name: order_item_shipped_ts
  - name: order_item_returned_flag
  - name: order_item_quantity
  - name: order_item_unit_price
  - name: order_item_total_amount
  - name: order_item_margin_amount

measures:
  - name: line_items
    type: count
    description: Count of order item rows.
  - name: total_quantity
    type: sum
    expression: "{sales_enriched.order_item_quantity}"
    description: Total ordered quantity.
  - name: total_revenue
    type: sum
    expression: "{sales_enriched.order_item_total_amount}"
    description: Total revenue from order items.
  - name: total_margin
    type: sum
    expression: "{sales_enriched.order_item_margin_amount}"
    description: Total margin amount.
  - name: avg_unit_price
    type: avg
    expression: "{sales_enriched.order_item_unit_price}"
    description: Average order item unit price.

segments:
  - name: fulfilled_orders
    expression: "{sales_enriched.order_item_fulfillment_status} = 'Fulfilled'"
  - name: returned_orders
    expression: "{sales_enriched.order_item_returned_flag} = true"
