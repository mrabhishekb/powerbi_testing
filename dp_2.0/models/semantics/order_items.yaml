kind: semantic
name: order_items
depends_on: order_items
description: Order line facts including quantity, pricing, fulfillment, and revenue metrics.

joins:
  - name: products
    type: many_to_one
    expression: "{order_items.product_id} = {products.product_id}"

dimensions:
  - name: order_item_id
    behavior:
      type: identifier
  - name: order_id
  - name: product_id
  - name: fulfillment_status
  - name: warehouse_region
  - name: shipped_date
  - name: order_item_shipped_month
  - name: returned_flag
  - name: order_item_quantity
    public: false
  - name: order_item_total_amount
    public: false
  - name: order_item_margin_amount
    public: false
  - name: order_item_unit_price
    public: false

measures:
  - name: line_items
    type: count
    expression: "{order_items.order_item_id}"
  - name: total_quantity
    type: sum
    expression: "{order_items.order_item_quantity}"
  - name: total_revenue
    type: sum
    expression: "{order_items.order_item_total_amount}"
  - name: total_margin
    type: sum
    expression: "{order_items.order_item_margin_amount}"
  - name: avg_unit_price
    type: avg
    expression: "{order_items.order_item_unit_price}"
