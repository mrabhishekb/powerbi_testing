views:
  - name: monthly_revenue_trend
    description: "Monthly trend of line item count and revenue."
    tables:
      - join_path: order_items
        includes:
          - order_item_shipped_month
          - line_items
          - total_revenue

  - name: category_revenue_split
    description: "Revenue split by product category."
    tables:
      - join_path: order_items
        includes:
          - total_revenue
          - line_items
      - join_path: order_items.products
        includes:
          - product_category
